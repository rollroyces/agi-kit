name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: infra/irt/requirements.txt

      - name: Install dependencies
        run: pip install -r infra/irt/requirements.txt

      - name: Test agent/tests
        run: python -m unittest discover -s agent/tests

      - name: Test agent/reflector/tests
        run: python -m unittest discover -s agent/reflector/tests

      - name: Test standard/conformance
        run: python -m unittest discover -s standard/conformance

      - name: Test domains/arc/audit
        run: python -m unittest discover -s domains/arc/audit -p "test_*.py"

      - name: Test domains/arc/grading
        run: python -m unittest discover -s domains/arc/grading -p "test_*.py"

      - name: Test infra/irt/tests
        run: python -m unittest discover -s infra/irt/tests -p "test_*.py"